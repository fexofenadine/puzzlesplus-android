<!doctype html>
<html lang="en" prefix="og: http://ogp.me/ns#">
  <head>
    <meta charset="utf-8" />
    <title>Puzzles Plus</title>
    <meta
      name="description"
      content="Free Windows style puzzle games: Minesweeper, Takuzu, Nonograms, Sudoku and 2048, with hints that explain themselves"
    />
    <!--the games live in their own folders, old links land on the last game or minesweeper-->
    <meta http-equiv="refresh" content="0; url=minesweeper/index.html" />
    <meta property="og:title" content="Puzzles Plus" />
    <meta
      property="og:description"
      content="Free Windows style puzzle games: Minesweeper, Takuzu, Nonograms, Sudoku and 2048, with hints that explain themselves"
    />
    <meta property="og:url" content="https://fexofenadine.github.io/puzzlesplus/" />
    <meta property="og:image" content="https://fexofenadine.github.io/puzzlesplus/preview.png" />
    <meta property="og:image:width" content="1280" />
    <meta property="og:image:height" content="640" />
    <meta property="og:type" content="website" />
    <link rel="canonical" href="https://fexofenadine.github.io/puzzlesplus/" />
    <link rel="apple-touch-icon" href="/icon.png" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <script>
      //the game played last, else minesweeper
      var game = 'minesweeper'
      try {
        var last = localStorage.getItem('lastGame')
        if (/^(minesweeper|takuzu|nonograms|sudoku|2048)$/.test(last)) game = last
      } catch (error) {}
      location.replace(game + '/index.html' + location.search + location.hash)
    </script>
  </head>
  <body>
    <a href="minesweeper/">Puzzles Plus</a>
  </body>
</html>
